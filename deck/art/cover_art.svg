<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 490 400">
  <!-- axes -->
  <path d="M150 340 H480 M150 340 V40" stroke="#000" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- candlesticks: green = up day, blue = down day -->
  <g stroke="#000" stroke-width="2">
    <path d="M182 250 V312"/><rect x="173" y="262" width="18" height="40" fill="#00D09C"/>
    <path d="M218 236 V300"/><rect x="209" y="246" width="18" height="38" fill="#5367F5"/>
    <path d="M254 214 V288"/><rect x="245" y="226" width="18" height="48" fill="#00D09C"/>
    <path d="M290 222 V296"/><rect x="281" y="236" width="18" height="44" fill="#5367F5"/>
    <path d="M326 180 V262"/><rect x="317" y="192" width="18" height="54" fill="#00D09C"/>
    <path d="M362 170 V240"/><rect x="353" y="182" width="18" height="40" fill="#00D09C"/>
    <path d="M398 176 V250"/><rect x="389" y="188" width="18" height="44" fill="#5367F5"/>
    <path d="M434 120 V210"/><rect x="425" y="134" width="18" height="60" fill="#00D09C"/>
  </g>
  <!-- the market falls, then recovers (dashed blue) -->
  <path d="M160 150 C200 160 230 250 270 268 C310 286 330 220 370 200 C410 180 440 190 476 150" stroke="#5367F5" stroke-width="4" fill="none" stroke-dasharray="10 7" stroke-linecap="round"/>
  <!-- steady SIP growth (green) with an up arrow -->
  <polyline points="160,300 196,276 232,286 268,248 304,258 340,214 376,222 412,176 448,150" stroke="#00D09C" stroke-width="7" fill="none" stroke-linejoin="round" stroke-linecap="round"/>
  <g fill="#fff" stroke="#00D09C" stroke-width="4">
    <circle cx="196" cy="276" r="6"/><circle cx="268" cy="248" r="6"/><circle cx="340" cy="214" r="6"/><circle cx="412" cy="176" r="6"/>
  </g>
  <path d="M448 150 L472 98" stroke="#00D09C" stroke-width="7" stroke-linecap="round"/>
  <path d="M456 98 L476 88 L478 110 Z" fill="#00D09C" stroke="#00D09C" stroke-width="4" stroke-linejoin="round"/>
  <!-- coin stack -->
  <g stroke="#000" stroke-width="2.5">
    <ellipse cx="72" cy="340" rx="44" ry="12" fill="#00D09C"/>
    <path d="M28 340 V326 H116 V340" fill="#00D09C"/><ellipse cx="72" cy="326" rx="44" ry="12" fill="#00D09C"/>
    <path d="M28 326 V312 H116 V326" fill="#5367F5"/><ellipse cx="72" cy="312" rx="44" ry="12" fill="#5367F5"/>
    <path d="M28 312 V298 H116 V312" fill="#00D09C"/><ellipse cx="72" cy="298" rx="44" ry="12" fill="#00D09C"/>
  </g>
  <text x="72" y="304" font-family="Arial" font-weight="700" font-size="16" text-anchor="middle" fill="#000">&#8377;</text>
  <!-- SIPal sprout sitting on the coins -->
  <path d="M72 226 C72 214 72 206 72 198" stroke="#000" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M72 206 C60 206 51 198 49 186 C61 186 70 193 72 206Z" fill="#00D09C" stroke="#000" stroke-width="2"/>
  <path d="M72 203 C84 203 93 195 96 183 C84 183 75 190 72 203Z" fill="#5367F5" stroke="#000" stroke-width="2"/>
  <ellipse cx="72" cy="258" rx="36" ry="34" fill="#00D09C" stroke="#000" stroke-width="2.5"/>
  <circle cx="60" cy="254" r="4.5" fill="#000"/><circle cx="84" cy="254" r="4.5" fill="#000"/>
  <circle cx="61.5" cy="252.5" r="1.4" fill="#fff"/><circle cx="85.5" cy="252.5" r="1.4" fill="#fff"/>
  <path d="M61 268 Q72 278 83 268" stroke="#000" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M106 246 C116 236 120 224 117 214 C111 220 106 232 104 242Z" fill="#00D09C" stroke="#000" stroke-width="2"/>
  <path d="M124 208 Q130 216 127 226" stroke="#5367F5" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M132 202 Q140 214 136 228" stroke="#5367F5" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>
